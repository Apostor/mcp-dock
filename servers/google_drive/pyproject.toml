[project]
name = "mcp-dock-google-drive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp-dock-core",
    "google-api-python-client>=2.0",
]

[tool.uv.sources]
mcp-dock-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers/google_drive"]
