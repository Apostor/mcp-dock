services:
  traefik:
    image: traefik:2.11.31
    ports:
      - "80:80"
      - "8080:8080"
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  mcp-dock:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./tokens:/opt/app/tokens
      - ./credentials:/opt/app/credentials:ro
      - ./gateway.yaml:/opt/app/gateway.yaml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp-dock.rule=PathPrefix(`/`)"
      - "traefik.http.routers.mcp-dock.entrypoints=web"
      - "traefik.http.services.mcp-dock.loadbalancer.server.port=8000"
    restart: unless-stopped
    depends_on:
      - traefik
