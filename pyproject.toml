[project]
name = "mcp-dock"
version = "0.1.0"
description = "Self-hosted MCP servers on localhost — privacy-first, zero third-party exposure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp-dock-core",
]

[project.scripts]
mcp-dock = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.uv.workspace]
members = ["core", "servers/*"]

[tool.uv.sources]
mcp-dock-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
